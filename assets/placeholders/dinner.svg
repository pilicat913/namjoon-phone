<svg xmlns="http://www.w3.org/2000/svg" width="720" height="900" viewBox="0 0 600 750"><rect width="600" height="750" fill="#9a9e87"/><rect x="22" y="22" width="556" height="706" rx="8" fill="#f4f0e7"/><g fill="#514f46" font-family="sans-serif"><text x="36" y="84" font-size="17" letter-spacing="3">照片待补 · 2012.12</text><text x="36" y="150" font-size="30">吃饭的时候</text><text x="36" y="206" font-size="21"><tspan x="36" dy="32">从桌边随手拍过去，几个人围着简单的饭菜。</tspan><tspan x="36" dy="32">杯子、筷子和手机放得很乱，有人伸手夹菜，</tspan><tspan x="36" dy="32">挡住了半张脸。</tspan></text><text x="36" y="680" font-size="16" fill="#8a877b">预留画面说明 / 后续替换为图片</text></g></svg>