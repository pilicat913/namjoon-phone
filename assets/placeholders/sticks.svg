<svg xmlns="http://www.w3.org/2000/svg" width="720" height="900" viewBox="0 0 600 750"><rect width="600" height="750" fill="#b6b09b"/><rect x="22" y="22" width="556" height="706" rx="8" fill="#f4f0e7"/><g fill="#514f46" font-family="sans-serif"><text x="36" y="84" font-size="17" letter-spacing="3">照片待补 · 2013.03</text><text x="36" y="150" font-size="30">这个是左手</text><text x="36" y="206" font-size="21"><tspan x="36" dy="32">一张舞蹈笔记的近照：纸上密密麻麻画着火柴</tspan><tspan x="36" dy="32">人，旁边有箭头、圈和修改痕迹。没有工整排</tspan><tspan x="36" dy="32">版。</tspan></text><text x="36" y="680" font-size="16" fill="#8a877b">预留画面说明 / 后续替换为图片</text></g></svg>