<svg xmlns="http://www.w3.org/2000/svg" width="720" height="900" viewBox="0 0 600 750"><rect width="600" height="750" fill="#95937d"/><rect x="22" y="22" width="556" height="706" rx="8" fill="#f4f0e7"/><g fill="#514f46" font-family="sans-serif"><text x="36" y="84" font-size="17" letter-spacing="3">照片待补 · 2012.05</text><text x="36" y="150" font-size="30">又来一个人</text><text x="36" y="206" font-size="21"><tspan x="36" dy="32">玄关里多出一个行李箱，几双鞋勉强挪到一侧</tspan><tspan x="36" dy="32">。右下角拍进了南俊自己的拖鞋，照片轻微失</tspan><tspan x="36" dy="32">焦。</tspan></text><text x="36" y="680" font-size="16" fill="#8a877b">预留画面说明 / 后续替换为图片</text></g></svg>