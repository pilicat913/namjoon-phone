<svg xmlns="http://www.w3.org/2000/svg" width="720" height="900" viewBox="0 0 600 750"><rect width="600" height="750" fill="#ada48b"/><rect x="22" y="22" width="556" height="706" rx="8" fill="#f4f0e7"/><g fill="#514f46" font-family="sans-serif"><text x="36" y="84" font-size="17" letter-spacing="3">照片待补 · 2011.06</text><text x="36" y="150" font-size="30">多带的一份饭</text><text x="36" y="206" font-size="21"><tspan x="36" dy="32">桌上放着吃完的外卖盒和几张摊平的零钱。拍</tspan><tspan x="36" dy="32">照的人离得有点近，饭盒边缘没拍全。</tspan></text><text x="36" y="680" font-size="16" fill="#8a877b">预留画面说明 / 后续替换为图片</text></g></svg>