<svg xmlns="http://www.w3.org/2000/svg" width="720" height="900" viewBox="0 0 600 750"><rect width="600" height="750" fill="#929d84"/><rect x="22" y="22" width="556" height="706" rx="8" fill="#f4f0e7"/><g fill="#514f46" font-family="sans-serif"><text x="36" y="84" font-size="17" letter-spacing="3">照片待补 · 2013.01</text><text x="36" y="150" font-size="30">这次拍到我了</text><text x="36" y="206" font-size="21"><tspan x="36" dy="32">别人坐在对面拍的南俊。他低头吃饭，还没有</tspan><tspan x="36" dy="32">发现镜头。画面稍微歪了一点，桌角占去很大</tspan><tspan x="36" dy="32">一块。</tspan></text><text x="36" y="680" font-size="16" fill="#8a877b">预留画面说明 / 后续替换为图片</text></g></svg>