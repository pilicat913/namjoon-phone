<!-- 字体异步加载：不挡住页面显示，加载好后自动换上 -->
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
<style>
#boot{position:fixed;inset:0;z-index:999;background:#000;color:#fff;display:grid;place-items:center;text-align:center;font-family:"Helvetica Neue",Helvetica,"PingFang SC","Noto Sans SC",sans-serif;transition:opacity .5s}
#boot[hidden]{display:none}#boot.out{opacity:0}
#boot .boot-in{max-width:300px;padding:0 24px}
#boot .boot-spin{width:30px;height:30px;margin:0 auto 18px;border-radius:50%;border:3px solid rgba(255,255,255,.18);border-top-color:#fff;animation:bootspin .9s linear infinite}
@keyframes bootspin{to{transform:rotate(360deg)}}
#boot .boot-t{font-size:15px;color:#bbb;margin:0 0 22px}
#boot .boot-tip{font-size:15px;line-height:1.8;margin:0 0 26px}
#boot .boot-tip b{color:#ffe14d;font-weight:700}
#boot .boot-c{font-size:11px;color:#777;margin:0}
</style>
<link rel="stylesheet" href="css/phone.css">
<link rel="stylesheet" href="css/chat.css">
<link rel="stylesheet" href="css/ios.css">
</head>
<body>
<div id="boot" hidden><div class="boot-in"><div class="boot-spin"></div><p class="boot-t">正在加载……</p>
  <p class="boot-tip">小提示：都看完以后<br>可以去 <b>设置 → 跳转时间</b><br>看看 6 月 13 日那天</p>
  <p class="boot-c">根据公开经历进行同人创作，聊天及部分日期为虚构编排</p></div></div>
<script>
/* 网慢时才显示加载提示：0.9 秒内加载完就直接进入 */
(function(){var b=document.getElementById('boot'),shown=false;var t=setTimeout(function(){b.hidden=false;shown=true;},900);
window.addEventListener('load',function(){clearTimeout(t);if(!shown){b.remove();return;}
setTimeout(function(){b.classList.add('out');setTimeout(function(){b.remove();},500);},1800);});
b.addEventListener('click',function(){if(document.readyState==='complete'){b.classList.add('out');setTimeout(function(){b.remove();},500);}});})();
</script>
<div id="stage">
  <div id="device">
    <div id="screen">
      <div id="statusbar" class="sb-trans">
        <span class="sb-left" aria-hidden="true">
          <span class="sb-bars"><i></i><i></i><i></i><i></i><i></i></span>
          <span class="sb-carrier">SKTelecom</span>
          <svg class="sb-wifi" viewBox="0 0 16 12"><path d="M8 2.3c2.4 0 4.6.9 6.2 2.5l1.2-1.3C13.4 1.4 10.8.3 8 .3S2.6 1.4.6 3.5l1.2 1.3C3.4 3.2 5.6 2.3 8 2.3zm0 3.6c1.4 0 2.7.5 3.7 1.5l1.2-1.3C11.6 4.8 9.9 4.1 8 4.1s-3.6.7-4.9 2l1.2 1.3c1-1 2.3-1.5 3.7-1.5zm0 3.4c-.5 0-1 .2-1.3.6L8 11.7l1.3-1.8c-.3-.4-.8-.6-1.3-.6z"/></svg>
        </span>
        <span class="sb-time" data-clock="short">23:47</span>
        <svg class="sb-lock" viewBox="0 0 9 12" aria-hidden="true"><path fill="#fff" d="M1.6 5.2V3.6a2.9 2.9 0 0 1 5.8 0v1.6h.4c.6 0 1.2.5 1.2 1.2v4.4c0 .6-.6 1.2-1.2 1.2H1.2C.6 12 0 11.4 0 10.8V6.4c0-.7.6-1.2 1.2-1.2zm1.2 0h3.4V3.6a1.7 1.7 0 0 0-3.4 0z"/></svg>
        <span class="sb-right" aria-hidden="true"><span class="sb-batt-num">63%</span><span class="sb-batt"></span></span>
      </div>
      <div id="layers"></div>
      <div id="banner-layer"></div>
    </div>
  </div>
